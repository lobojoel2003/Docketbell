<div class="field {% if field.errors %}field--error{% endif %} {% if field.field.widget.input_type == 'checkbox' %}field--check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
  <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="muted">· {{ optional_label }}</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
</div>
