{% load i18n docketbell %}<ol class="dots" aria-label="{% translate 'Reminders' %}">{% for r in reminders %}<li class="dot dot--{{ r.status }}" data-tip="{{ r.get_kind_display }} · {{ r.get_status_display }} · {{ r.send_at|date:'M j, g:i A' }}"><span class="visually-hidden">{{ r.get_kind_display }}: {{ r.get_status_display }}</span></li>{% empty %}<li class="muted">–</li>{% endfor %}</ol>
