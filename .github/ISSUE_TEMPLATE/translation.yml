name: Translation
description: Fix a translation, or ask for a new language.
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Which text, and what should it say?
      description: Copy the text from the Messages page. Keep {placeholders}, 1, 2 and STOP exactly as they are.
    validations:
      required: true
