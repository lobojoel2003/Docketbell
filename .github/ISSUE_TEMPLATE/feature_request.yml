name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is affected (staff, people getting texts) and how often?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
